# Base de données de développement : MySQL 8.4 + Adminer (interface web).
# Démarrage : npm run db:up   (les variables viennent de backend/.env)
# Arrêt     : npm run db:down (les données sont conservées dans le volume « mysql_data »)
name: smart-ecommerce

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans backend/.env}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME manquant dans backend/.env}
      MYSQL_USER: ${DB_USER:?DB_USER manquant dans backend/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans backend/.env}
      # Utilisée par docker/mysql/init pour créer la base de test
      DB_NAME_TEST: ${DB_NAME_TEST:-}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql

volumes:
  mysql_data:
